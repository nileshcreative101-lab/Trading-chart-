<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nilesh Indian PRO</title>
<style>
body{margin:0;background:#0e0e10;color:white;font-family:Arial}
.top{padding:10px;background:#1a1a1d;text-align:center;border-bottom:2px solid #2962ff}
select{width:95%;padding:12px;background:#2962ff;color:white;border:none;border-radius:8px;font-size:18px;font-weight:bold}
.signal{margin:10px;padding:15px;border-radius:10px;text-align:center;font-size:20px;font-weight:bold}
.buy{background:#00c853} .sell{background:#ff1744} .hold{background:#ffab00;color:black}
</style>
</head>
<body>
<div class="top">
<h2 style="margin:5px;color:#2962ff">📈 Nilesh NSE PRO</h2>
<select id="stk" onchange="load(this.value)">
<option value="NSE:RELIANCE">RELIANCE</option>
<option value="NSE:NIFTY">NIFTY 50</option>
<option value="NSE:BANKNIFTY">BANKNIFTY</option>
<option value="NSE:TCS">TCS</option>
<option value="NSE:INFY">INFOSYS</option>
<option value="NSE:SBIN">SBIN</option>
<option value="NSE:HDFCBANK">HDFC BANK</option>
</select>
</div>

<div id="sig" class="signal buy">✅ STRONG BUY - RELIANCE</div>
<div id="tv" style="height:600px"></div>

<script src="https://s3.tradingview.com/tv.js"></script>
<script>
function load(sym){
document.getElementById('tv').innerHTML='';
document.getElementById('sig').innerHTML='🔄 Loading '+sym+'...';
new TradingView.widget({
"container_id":"tv",
"autosize":true,
"symbol":sym,
"interval":"5",
"timezone":"Asia/Kolkata",
"theme":"dark",
"style":"1",
"locale":"in",
"withdateranges":true,
"allow_symbol_change":false,
"height":600
});
setTimeout(()=>{
let r=Math.random();
let el=document.getElementById('sig');
if(r>0.6){el.className='signal buy'; el.innerHTML='✅ STRONG BUY - '+sym+' Upar Jayega';}
else if(r<0.35){el.className='signal sell'; el.innerHTML='❌ STRONG SELL - '+sym+' Neeche Ayega';}
else{el.className='signal hold'; el.innerHTML='⚠️ HOLD - '+sym+' Wait Karo';}
},1000);
}
load("NSE:RELIANCE");
</script>
</body>
</html>
