<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nilesh Select Chart</title>
<style>
body{margin:0;background:#0e0e10;color:white;font-family:Arial}
.header{background:#1e1e21;padding:15px;text-align:center}
select{width:98%;padding:14px;font-size:18px;background:#2962ff;color:white;border:none;border-radius:8px;font-weight:bold}
#box{padding:12px;text-align:center;font-size:18px;font-weight:bold;margin:10px;border-radius:8px;background:#00c853}
</style>
</head>
<body>

<div class="header">
<h3 style="margin:0 0 10px 0;color:#2962ff">📈 Select Any Indian Stock</h3>
<select id="mySymbol" onchange="showChart()">
<option value="NSE:RELIANCE">RELIANCE</option>
<option value="NSE:TCS">TCS</option>
<option value="NSE:INFY">INFOSYS</option>
<option value="NSE:SBIN">SBIN Bank</option>
<option value="NSE:HDFCBANK">HDFC BANK</option>
<option value="NSE:ICICIBANK">ICICI BANK</option>
<option value="NSE:NIFTY">NIFTY 50</option>
<option value="NSE:BANKNIFTY">BANK NIFTY</option>
<option value="NSE:TATAMOTORS">TATA MOTORS</option>
<option value="NSE:ITC">ITC</option>
</select>
</div>

<div id="box">Loading RELIANCE...</div>
<div id="chartBox" style="height:600px"></div>

<script src="https://s3.tradingview.com/tv.js"></script>
<script>
function showChart(){
  var sym = document.getElementById("mySymbol").value;
  document.getElementById("chartBox").innerHTML = "";
  document.getElementById("box").innerHTML = "📊 Showing: " + sym;
  
  new TradingView.widget({
    "container_id": "chartBox",
    "autosize": true,
    "symbol": sym,
    "interval": "5",
    "timezone": "Asia/Kolkata",
    "theme": "dark",
    "style": "1",
    "locale": "in",
    "height": 600
  });
}
// First time load
showChart();
</script>

</body>
</html>
