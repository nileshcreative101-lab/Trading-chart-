<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRO Trading Chart - Nilesh</title>
<style>
body{margin:0;font-family:Arial;background:#0e0e10;color:white}
.header{background:#1a1a1d;padding:15px;text-align:center;border-bottom:2px solid #2962ff}
.header h1{margin:0;color:#2962ff}
.live{color:#00ff88;animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
.container{padding:10px}
.card{background:#1e1e21;border-radius:10px;padding:10px;margin-bottom:15px}
</style>
</head>
<body>
<div class="header">
<h1>📈 Nilesh PRO Trading Chart</h1>
<p><span class="live">● LIVE</span> Market Open</p>
</div>

<div class="container">
<div class="card">
<!-- TradingView Widget -->
<div class="tradingview-widget-container">
<div id="tradingview_chart"></div>
<script src="https://s3.tradingview.com/tv.js"></script>
<script>
new TradingView.widget({
"autosize": true,
"symbol": "NSE:NIFTY",
"interval": "5",
"timezone": "Asia/Kolkata",
"theme": "dark",
"style": "1",
"locale": "in",
"height": 500,
"container_id": "tradingview_chart"
});
</script>
</div>
</div>

<div class="card">
<h3>🎯 Today's Signal</h3>
<p>✅ BUY NIFTY Above 24300</p>
<p>❌ SELL Below 24100</p>
<p>📊 Support: 24100 | Resistance: 24400</p>
</div>
</div>
</body>
</html>
