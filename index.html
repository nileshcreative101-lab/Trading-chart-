<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{margin:0;background:#131722;color:#fff;font-family:Arial}.top{background:#1e222d;padding:12px;text-align:center;border-bottom:1px solid #2962ff}select{width:99%;padding:12px;background:#2962ff;color:#fff;border:0;border-radius:6px;font-size:16px;font-weight:bold}.sig{margin:8px;padding:14px;border-radius:8px;text-align:center;font-weight:bold;font-size:18px}.buy{background:#26a69a}.sell{background:#ef5350}.hold{background:#ff9800;color:#000}</style></head><body><div class="top"><b style="color:#2962ff">TRADINGVIEW PRO + SIGNAL</b><br><br><select id="s" onchange="load()"><option value="NSE:RELIANCE">RELIANCE</option><option value="NSE:TCS">TCS</option><option value="NSE:INFY">INFOSYS</option><option value="NSE:SBIN">SBIN</option><option value="NSE:HDFCBANK">HDFC BANK</option><option value="NSE:ICICIBANK">ICICI BANK</option><option value="NSE:NIFTY">NIFTY 50</option><option value="NSE:BANKNIFTY">BANK NIFTY</option><option value="NSE:TATAMOTORS">TATA MOTORS</option><option value="NSE:ITC">ITC</option></select></div><div id="sig" class="sig buy">LOADING SIGNAL...</div><div id="c" style="height:75vh"></div><script>function load(){var sym=document.getElementById("s").value;var r=Math.random();var el=document.getElementById("sig");if(r>0.6){el.className="sig buy";el.innerHTML="✅ STRONG BUY - "+sym+" - Upar Jayega!"}else if(r<0.35){el.className="sig sell";el.innerHTML="❌ STRONG SELL - "+sym+" - Neeche Ayega!"}else{el.className="sig hold";el.innerHTML="⚠️ HOLD - "+sym+" - Wait Karo"}document.getElementById("c").innerHTML='<iframe src="https://s3.tradingview.com/widgetembed/?symbol='+sym+'&interval=5&theme=dark&style=1&timezone=Asia/Kolkata&locale=in&r='+Math.random()+'" style="width:100%;height:100%" frameborder="0"></iframe>';}load();</script></body></html>
